[workspace]

[package]
edition      = "2024"
name         = "esp-sensor-embassy"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "esp-sensor-embassy"

[dependencies]
esp-hal = { version = "1.0.0", features = ["esp32c6", "unstable"] }
esp-println = { version = "0.16.1", features = ["esp32c6", "log-04"] }
esp-rtos = { version = "0.2.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
] }

esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32c6"] }

bt-hci = "0.6.0"
embassy-executor = { version = "0.9.1", features = [] }
embassy-sync = "0.7.2"
embassy-time = "0.5.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
esp-alloc = "0.9.0"
esp-radio = { version = "0.17.0", features = [
  "ble",
  "esp-alloc",
  "esp32c6",
  "unstable",
] }
trouble-host = { version = "0.5.0", features = ["gatt"] }

embedded-storage = "0.3.1"

critical-section = "1.2.0"
static_cell      = "2.1.1"

zigbee = { path = "../../zigbee" }
zigbee-base-device-behavior = { path = "../../zigbee-base-device-behavior" }


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
